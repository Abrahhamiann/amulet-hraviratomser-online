# Include inside the EXISTING amulet.am HTTPS server block.
# Keep its current TLS directives and all modern application locations.
location = /browser-support.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/amulet-security.conf;
    try_files $uri =404;
}
location = /legacy { return 302 /legacy/$is_args$args; }
location ^~ /legacy/ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/amulet-security.conf;
    try_files $uri $uri/ /legacy/index.html;
}
# Public data and RSVP only. No new authentication or payment paths.
location ~ ^/legacy-api/api/(?:templates(?:/[^/]+(?:/legacy-image)?)?|invitations/[^/]+(?:/legacy-image/[0-9])?|rsvp/[^/]+)$ {
    rewrite ^/legacy-api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host server.amulet.am;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # These routes are anonymous. Safari 9 can omit Origin on same-origin XHR.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    limit_except GET POST { deny all; }
    proxy_read_timeout 25s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/amulet-security.conf;
}
location ^~ /legacy-api/media/ {
    alias /var/lib/amulet/media/;
    add_header Cache-Control "public, max-age=86400" always;
    include /etc/nginx/snippets/amulet-security.conf;
}
location /legacy-api/ { return 404; }
