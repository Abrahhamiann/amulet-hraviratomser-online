# /etc/nginx/sites-available/amulet.am
# Публичный сайт (React SPA, статика из client/dist)

server {
    listen 80;
    listen [::]:80;
    server_name amulet.am www.amulet.am;

    root /var/www/amulet/amulet-hraviratomser-online/client/dist;
    index index.html;

    access_log /var/log/nginx/amulet.am.access.log;
    error_log  /var/log/nginx/amulet.am.error.log;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;

    sendfile on;
    tcp_nopush on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # хэшированные ассеты Vite можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|webp|gif|svg|ico|mp3|mp4|json|lottie)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA-роутинг: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
