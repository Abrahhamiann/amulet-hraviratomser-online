# /etc/nginx/sites-available/server.amulet.am
# API (Node/Express, слушает 127.0.0.1:5000)

server {
    listen 80;
    listen [::]:80;
    server_name server.amulet.am;

    access_log /var/log/nginx/server.amulet.am.access.log;
    error_log  /var/log/nginx/server.amulet.am.error.log;

    # express.json({ limit: '15mb' }) — даём запас
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location ^~ /media/ {
        alias /var/lib/amulet/media/;
        sendfile on;
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
