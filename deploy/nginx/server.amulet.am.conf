# /etc/nginx/sites-available/server.amulet.am
# API (Node/Express, слушает 127.0.0.1:5000)

server {
    listen 80;
    listen [::]:80;
    server_name server.amulet.am;

    access_log /var/log/nginx/server.amulet.am.access.log;
    error_log  /var/log/nginx/server.amulet.am.error.log;

    # express.json({ limit: '15mb' }) — даём запас
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
