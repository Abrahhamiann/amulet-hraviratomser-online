# /etc/nginx/sites-available/admin.amulet.am
# Админка (TanStack Start / Nitro SSR, слушает 127.0.0.1:3000)

server {
    listen 80;
    listen [::]:80;
    server_name admin.amulet.am;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

    location ~ /\.(?!well-known(?:/|$)) { deny all; }

    access_log /var/log/nginx/admin.amulet.am.access.log;
    error_log  /var/log/nginx/admin.amulet.am.error.log;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
